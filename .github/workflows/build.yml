name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Create DMG
        run: |
          cd build/macos/Build/Products/Release
          hdiutil create -volname "Icefish" -srcfolder "icefish.app" -ov -format UDZO "Icefish.dmg"
      - name: Upload Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: Icefish-macOS-Intel
          path: build/macos/Build/Products/Release/Icefish.dmg
      - name: Build ARM64
        run: flutter build macos --release --target-cpu arm64
      - name: Create ARM64 DMG
        run: |
          cd build/macos/Build/Products/Release
          hdiutil create -volname "Icefish" -srcfolder "icefish.app" -ov -format UDZO "Icefish-arm64.dmg"
      - name: Upload ARM64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: Icefish-macOS-ARM64
          path: build/macos/Build/Products/Release/Icefish-arm64.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Icefish-Windows
          path: build/windows/x64/runner/Release/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: Icefish-Linux
          path: build/linux/x64/release/bundle/

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Icefish-macOS-Intel/*
            Icefish-macOS-ARM64/*
            Icefish-Windows/*
            Icefish-Linux/*
